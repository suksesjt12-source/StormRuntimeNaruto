name: Storm Runtime Naruto - Winlator Runtime APK
on:
  workflow_dispatch:
  push:
    branches: ["experiment/wine-hangover-android"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Storm Runtime and pinned runtime source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned Winlator runtime source
        run: |
          set -euo pipefail
          test "$(git -C third_party/winlator-app rev-parse HEAD)" = "f8a211ce7fd776de9a2642b45d166016876eaa86"
          test -s third_party/winlator-app/app/src/main/assets/rootfs.tzst
          test -s third_party/winlator-app/app/src/main/assets/pulseaudio.tzst
          test -s third_party/winlator-app/app/src/main/assets/box64/box64-0.4.4.tzst
          test -s third_party/winlator-app/app/src/main/assets/dxwrapper/dxvk-1.10.3.tzst

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;24.0.8215888"

      - name: Brand the upstream Android runtime as Storm Runtime
        run: python3 scripts/prepare-winlator-storm.py third_party/winlator-app

      - name: Verify Storm launcher integration patch
        run: |
          set -euo pipefail
          grep -q 'PILIH FOLDER GAME' third_party/winlator-app/app/src/main/java/com/winlator/MainActivity.java
          grep -q 'XServerDisplayActivity.class' third_party/winlator-app/app/src/main/java/com/winlator/MainActivity.java
          grep -q 'NSUNSR.exe' third_party/winlator-app/app/src/main/java/com/winlator/MainActivity.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build integrated Android runtime APK
        run: gradle --no-daemon -p third_party/winlator-app clean assembleDebug

      - name: Verify APK package, ARM64 ABI and embedded runtime assets
        shell: bash
        run: |
          set -euo pipefail
          APK="third_party/winlator-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING"
          grep -q "package: name='id.stormruntime.naruto'" <<< "$BADGING"
          grep -q "Storm Runtime Naruto" <<< "$BADGING"
          grep -q "native-code: 'arm64-v8a'" <<< "$BADGING"
          unzip -Z1 "$APK" > apk-contents.txt
          grep -Eq 'lib/arm64-v8a/lib(winlator|vortek|virgl)' apk-contents.txt
          sha256sum "$APK" | tee APK-SHA256.txt
          echo "Runtime source: brunodev85/winlator-app@f8a211ce7fd776de9a2642b45d166016876eaa86" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: id.stormruntime.naruto" >> "$GITHUB_STEP_SUMMARY"
          echo "ABI: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "This verifies packaging only; physical-device Windows game execution remains a separate test." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integrated Storm Runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: storm-runtime-naruto-integrated-debug
          path: |
            third_party/winlator-app/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 90
