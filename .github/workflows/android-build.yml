name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # Override the action's obsolete default "tools" package.
          packages: "platform-tools"

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package and ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='id.stormruntime.naruto'" <<< "$BADGING"
          grep -q "native-code: 'arm64-v8a'" <<< "$BADGING"

          unzip -Z1 "$APK" | tee apk-contents.txt
          grep -Fxq "lib/arm64-v8a/libstormcore.so" apk-contents.txt

          sha256sum "$APK" | tee APK-SHA256.txt
          echo "APK_SHA256=$(cut -d ' ' -f 1 APK-SHA256.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Verified package: id.stormruntime.naruto" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified ABI: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified JNI library: lib/arm64-v8a/libstormcore.so" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: APK verification does not test Wine, PE32 execution, DXVK, or game compatibility." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: storm-runtime-naruto-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 90
