name: Build Storm ARM64 Glibc rootfs

on:
  workflow_dispatch:
  push:
    branches: ["feature/mtk-glibc-runtime"]
    paths:
      - ".github/workflows/rootfs-arm64.yml"
      - "runtime/rootfs/**"
      - "scripts/build-rootfs-arm64.sh"

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mtk-glibc-runtime

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xz-utils

      - name: Build and validate rootfs
        run: |
          set -euo pipefail
          bash scripts/build-rootfs-arm64.sh

      - name: Upload ARM64 Glibc rootfs
        uses: actions/upload-artifact@v4
        with:
          name: storm-rootfs-bookworm-arm64
          path: |
            build/rootfs-arm64/storm-rootfs-bookworm-arm64.tar.xz
            build/rootfs-arm64/SHA256SUMS
            build/rootfs-arm64/stage/manifest.properties
          if-no-files-found: error
          retention-days: 30
