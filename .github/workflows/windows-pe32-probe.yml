name: Windows PE32 Probe Build
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tests/windows-pe32/**"
      - ".github/workflows/windows-pe32-probe.yml"

permissions:
  contents: read

jobs:
  build-pe32-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install i686 MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-i686 binutils-mingw-w64-i686 file

      - name: Compile Windows PE32 test executable
        run: |
          set -euo pipefail
          mkdir -p build/windows-pe32
          i686-w64-mingw32-gcc \
            -std=c11 -O2 -Wall -Wextra -Werror -static \
            tests/windows-pe32/pe32_probe.c \
            -o build/windows-pe32/storm-pe32-probe.exe
          file build/windows-pe32/storm-pe32-probe.exe | tee build/windows-pe32/file.txt
          i686-w64-mingw32-objdump -f build/windows-pe32/storm-pe32-probe.exe | tee build/windows-pe32/objdump.txt
          grep -Eq "pei-i386|architecture: i386" build/windows-pe32/objdump.txt
          i686-w64-mingw32-objdump -p build/windows-pe32/storm-pe32-probe.exe | grep -q "Magic[[:space:]]*010b"
          sha256sum build/windows-pe32/storm-pe32-probe.exe | tee build/windows-pe32/SHA256SUMS

      - name: Upload PE32 test executable
        uses: actions/upload-artifact@v4
        with:
          name: storm-windows-pe32-probe
          path: build/windows-pe32/
          if-no-files-found: error
          retention-days: 90
