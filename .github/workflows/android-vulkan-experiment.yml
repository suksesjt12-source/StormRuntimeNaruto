name: Android Vulkan Swapchain Experiment
on:
  push:
    branches: ["experiment/android-vulkan-swapchain"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install pinned Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build experimental APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK and ARM64 Vulkan JNI library
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -q "package: name='id.stormruntime.naruto'" <<< "$BADGING"
          grep -q "native-code: 'arm64-v8a'" <<< "$BADGING"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libstormcore.so"
          sha256sum "$APK" | tee APK-SHA256.txt
      - name: Upload experimental APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: storm-runtime-vulkan-swapchain-experiment
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30
